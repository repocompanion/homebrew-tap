name: ci

# The tap only changes when a new formula version is committed, so push and PR
# runs are limited to formula (or workflow) changes. The weekly schedule keeps
# validating against current Homebrew and fails if the tap falls behind the
# latest upstream release. Use workflow_dispatch to re-check on demand.
on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/**"
  # Every pull request runs the checks: they are required by branch protection,
  # so a path filter here would leave some PRs permanently unmergeable.
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # Installs Homebrew on Linux, otherwise reuses the runner's Homebrew.
      # It also taps this repository at the tested commit and trusts the tap,
      # so no actions/checkout step is needed.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        id: brew

      - name: audit formula
        if: runner.os == 'macOS'
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: brew audit --strict --online --os=all --arch=all "$TAP/repo-companion"

      - name: style formula
        if: runner.os == 'macOS'
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: brew style "$TAP/repo-companion"

      - name: livecheck formula
        if: runner.os == 'macOS'
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: brew livecheck --quiet --formula "$TAP/repo-companion"

      - name: check the tap is not behind the latest release
        if: runner.os == 'macOS' && github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: |
          set -euo pipefail
          json="$(brew livecheck --json --quiet --formula "$TAP/repo-companion")"
          current="$(jq -r '.[0].version.current // empty' <<<"$json")"
          latest="$(jq -r '.[0].version.latest // empty' <<<"$json")"
          if [[ -z "$current" || -z "$latest" ]]; then
            echo "::error::livecheck could not resolve the formula and upstream versions"
            echo "$json"
            exit 1
          fi
          echo "formula is $current; latest upstream release is $latest"
          if [[ "$current" != "$latest" ]]; then
            echo "::error::tap is behind: run scripts/bump.py v$latest and merge the PR"
            exit 1
          fi

      - name: install and test formula
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: |
          brew install "$TAP/repo-companion"
          brew test "$TAP/repo-companion"
          companion version
